<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
  <title>Bootstrap Example</title>
  <style>
    #hero-stuff {
      background-image: url(https://images.unsplash.com/photo-1465056836041-7f43ac27dcb5?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fG1vdW50YWlufGVufDB8MHwwfHx8MA%3D%3D);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    nav {
      width: 100vw;
      height: 50px;
      background-color: green;
      display: flex;
      align-items: center;
    }

    .nature2 {
      display: flex;
    }

    .card-holder{
      display: flex;
    }
    
    .spacer{
      width: 30px;
    }
    .spacer-large{
      width: 70%;
    }
  </style>
</head>

<body>
  <nav>
    <div class="nature">
      <p>NATURE GALLERY</p>
    </div>
    <div class="spacer-large"></div>
    <div class="nature2">
      <p>Home</p>
      <div class="spacer"></div>
      <p>Gallery</p>
      <div class="spacer"></div>
      <p>About</p>
      <div class="spacer"></div>
      <p>Contact</p>
    </div>
  </nav>
  <div class="px-4 py-5 my-5 text-center" id="hero-stuff">
    <h1 class="display-5 fw-bold">NATURE GALLERY</h1>
    <div class="col-lg-6 mx-auto">
      <p class="lead mb-4">Enjoy the beauty of nature in this gallery.</p>
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">

      </div>
    </div>
  </div>
  <div class="card-holder">
    <div class="card" style="width: 30rem;">
      <img
        src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8bW91bnRhaW58ZW58MHwwfDB8fHww"
        class="card-img-top" alt="...">
      <div class="card-body">
        <p class="card-text">Arial Photo of Foggy Mountains</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="card" style="width: 30rem;">
      <img src="wmremove-transformed.png" class="card-img-top" alt="...">
      <div class="card-body">
        <p class="card-text">Sun setting behind mountain lake</p>
      </div>
    </div>
  </div>
</body>

</html>
